version: 2

snapshots:
  - name: slv_drug_snp
    description: "snapshot for tracking changes in mkting_status"
    columns:
      - name: id_app_numb
        data_type: varchar
        description: "unique id for FDA application, can be repeated if marketing status changes"

      - name: app_numb
        data_type: varchar
        description: "desc of id_app_numb"

      - name: id_sponsor
        data_type: varchar
        description: "company"

      - name: id_drug_name
        data_type: varchar
        description: "drug"

      - name: id_disease
        data_type: varchar
        description: "disease for which is intended to be used"

      - name: id_mkting_status
        data_type: varchar
        description: "current marketing status"

      - name: price_per_dose
        data_type: float
        data_tests:
          - not_null
        description: "price of the dose"

      - name: loaded_at
        data_type: timestamp
        description: "date when data load occured"

      - name: dbt_scd_id
        data_type: varchar
        data_tests:
          - unique
        description: ""

      - name: dbt_updated_at
        data_type: timestamp_ntz
        description: ""

      - name: dbt_valid_from
        data_type: timestamp_ntz
        description: ""

      - name: dbt_valid_to
        data_type: timestamp_ntz
        description: ""