version: 2

sources:

  - name: google_sheets # name of the source 
    schema: google_sheets # this is the schema our raw data lives in
    database: BRONZE_DB_49 # this is the name of our database

    quoting:
      database: false
      schema: false
      identifier: false

    #config:
      #freshness:
        #warn_after: {count: 24, period: hour}
        #error_after: {count: 48, period: hour}

    tables:

      - name: budget
        config:
          loaded_at_field: fivetran_synced
        columns:
          - name: row_nmb
          - name: product_id
          - name: quantity
          - name: month
          - name: fivetran_synced