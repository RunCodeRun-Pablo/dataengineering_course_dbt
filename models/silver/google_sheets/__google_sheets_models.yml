version: 2

models:
  - name: stg_google_sheets__budget
    config:
      contract:
        enforced: true
    description: >
      Data about budget 
    columns:
      - name: row_nmb
        data_tests:
          - not_null
        data_type: text
        constraints:
          - type: not_null
        description: >
          number of the row
      - name: product_id
        data_type: TEXT                      
        constraints:
          - type: not_null
        description: >
          id of the product
      - name: quantity
        data_type: real
        constraints:
          - type: not_null
        description: >
          Ammount of the product
      - name: month
        data_type: TIMESTAMP_TZ                
        constraints:
          - type: not_null
        description: >
          Month of the product
      - name: fivetran_synced
        data_type: TIMESTAMP_TZ
        constraints:
          - type: not_null   
        description: >
          Date that the data was loaded.
   