version: 2

models:
  - name: slv_drug_name
    description: "table with drugs' names"
    columns:
      - name: id_drug_name
        data_type: varchar
        data_tests:
          - unique
        description: "drug name identifier"

      - name: desc_drug_name
        data_type: varchar
        description: "description of drug name"

  - name: slv_sponsor
    description: ""
    columns:
      - name: id_sponsor
        data_type: varchar
        data_tests:
          - unique
        description: "sponsor identifier"

      - name: desc_sponsor
        data_type: varchar
        description: "sponsor description"


  - name: slv_mkting_status
    description: ""
    columns:
      - name: id_mkting_status
        data_type: varchar
        data_tests:
          - unique
        description: "mkting_status identifier"

      - name: desc_mkting_status
        data_type: varchar
        description: "mkting_status description"
