version: 2

models:
  - name: slv_freq_health_staff
    description: "number of either doctors or pharmacists per country and year"
    columns:
      - name: id_medical_staff
        data_type: varchar       
        description: "medical staff identifier"

      - name: id_country
        data_type: varchar
        description: "country identifier"

      - name: id_period
        data_type: varchar
        description: "period (year) identifier"

      - name: staff_per_10000
        data_type: float
        data_tests:
          - not_null
        description: "number of either doctors or pharmacists per 10000 habitants"

  - name: slv_medical_staff
    description: "type of medical staff"
    columns:
      - name: id_medical_staff
        data_type: varchar
        data_tests:
          - unique
        description: "medical staff identifier"

      - name: desc_medical_staff
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['medical', 'pharmacist']
        description: "medical staff description"

  - name: slv_uhc_class
    description: "uhc class according to uhc index"
    columns:
      - name: id_uhc_class
        data_type: varchar
        data_tests:
          - unique
        description: "uhc class identifier"

      - name: desc_uhc_class
        data_type: varchar
        description: "UHC class description"

  - name: slv_uhc_index
    description: ""
    columns:
      - name: id_uhc_class
        data_type: varchar
        description: ""

      - name: id_country
        data_type: varchar
        description: ""

      - name: id_period
        data_type: varchar
        description: ""

      - name: uhc_index
        data_type: integer
        data_tests:
          - not_null
        description: ""