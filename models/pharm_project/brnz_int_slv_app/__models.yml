version: 2

models:
  - name: brnz_int_slv_diseases_list
    description: "list of diseases to avoid CTE repetition in slv_disease and slv_type_disease"
    columns:
      - name: disease
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['diabetes', 'tuberculosis', 'hepatitis', 'other', 'ets', 'chronic respiratory', 'hiv', 'infc respiratory', 'cancer', 'cardiovascular', 'total infc', 'total noninfc']
        description: "list of diseases"

  - name: brnz_int_slv_total_dis
    description: "append incremental table that combines both infectious and non-infectious diseases per country and year"
    columns:
      - name: country
        data_type: varchar
        description: "country"

      - name: period
        data_type: timestamp_ntz
        description: "period in years"

      - name: sex
        data_type: varchar
        description: "sex, either male, female or both"

      - name: total_prob
        data_type: float
        data_tests:
          - not_null
        description: "prob of dying specific disease"

      - name: prob_cancer
        data_type: float
        data_tests:
          - not_null
        description: "prob of dying specific disease"

      - name: prob_card
        data_type: float
        data_tests:
          - not_null
        description: "prob of dying specific disease"

      - name: prob_diab
        data_type: float
        data_tests:
          - not_null
        description: "prob of dying specific disease"

      - name: prob_resp
        data_type: float
        data_tests:
          - not_null
        description: "prob of dying specific disease"

      - name: total_inc
        data_type: float
        data_tests:
          - not_null
        description: "incidence of specific disease"

      - name: inc_ets
        data_type: float
        data_tests:
          - not_null
        description: "incidence of specific disease"

      - name: inc_hep
        data_type: float
        data_tests:
          - not_null
        description: "incidence of specific disease"

      - name: inc_hiv
        data_type: float
        data_tests:
          - not_null
        description: "incidence of specific disease"

      - name: inc_resp
        data_type: float
        data_tests:
          - not_null
        description: "incidence of specific disease"

      - name: inc_tub
        data_type: float
        data_tests:
          - not_null
        description: "incidence of specific disease"

  - name: brnz_int_slv_total_health_staff
    description: "combination of both pharmacists and doctors per country and year"
    columns:
      - name: period
        data_type: timestamp_ntz
        description: "period per year"

      - name: country
        data_type: varchar
        description: "country"

      - name: doct_per_10000
        data_type: float
        data_tests:
          - not_null
        description: "numb of doctors per 10000 habitants"

      - name: pharm_per_10000
        data_type: float
        data_tests:
          - not_null
        description: "numb of pharmacists per 10000 habitants"

  - name: brnz_int_slv_uhc_coverage
    description: "uhc index indicating health system level per country (0-49: low; 50-75: intermediate; 76-100: high)"
    columns:
      - name: country
        data_type: varchar
        description: "country"

      - name: period
        data_type: timestamp_ntz
        description: "period per year"

      - name: uhc_index
        data_type: 
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
                max_value: 100
        description: "number indicating health system level"

      - name: uhc_class
        data_type: varchar
        description: "class according to uhc_index"

