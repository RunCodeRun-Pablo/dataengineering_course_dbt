version: 2

models:
  - name: slv_country
    description: "countries table"
    columns:
      - name: id_country
        data_type: varchar
        data_tests:
          - unique
        description: "country identifier"

      - name: desc_country
        data_type: varchar
        description: "country description"

  - name: slv_disease_metrics
    description: "disease metrics (incidence or probability of death) per country, year and sex"
    columns:
      - name: id_country
        data_type: varchar
        description: "country identifier"

      - name: id_period
        data_type: varchar
        description: "period (year) identifier"

      - name: id_sex
        data_type: varchar
        description: "sex identifier"

      - name: metric_type
        data_type: varchar
        description: "either probability or incidence"

      - name: id_disease
        data_type: varchar
        description: "disease identifier"

      - name: value
        data_type: float
        data_tests:
          - not_null
        description: "value of probability or incidence per disease"

  - name: slv_disease
    description: "list of diseases"
    columns:
      - name: id_type_disease
        data_type: varchar
        description: "type of disease identifier"

      - name: id_disease
        data_type: varchar
        data_tests:
          - unique
        description: "disease identifier"

      - name: desc_disease
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['diabetes', 'tuberculosis', 'hepatitis', 'other', 'ets', 'chronic respiratory', 'hiv', 'infc respiratory', 'cancer', 'cardiovascular', 'total infc', 'total noninfc']
        description: "disease description"

  - name: slv_drug_name
    description: "table with drugs' names"
    columns:
      - name: id_drug_name
        data_type: varchar
        data_tests:
          - unique
        description: "drug name identifier"

      - name: desc_drug_name
        data_type: varchar
        description: "description of drug name"

  - name: slv_drug
    description: "table including prices per drug and applications"
    columns:
      - name: id_app_numb
        data_type: varchar
        data_tests:
          - unique
        description: "application identifier"

      - name: app_numb
        data_type: varchar
        description: "application number"

      - name: id_sponsor
        data_type: varchar
        description: "sponsor identifier"

      - name: id_drug_name
        data_type: varchar
        description: "drug name identifier"

      - name: id_disease
        data_type: varchar
        description: "specific FDA application disease intended use"

      - name: price_per_dose
        data_type: float
        data_tests:
          - not_null
        description: "price per drug dose"

  - name: slv_freq_health_staff
    description: "number of either doctors or pharmacists per country and year"
    columns:
      - name: id_medical_staff
        data_type: varchar       
        description: "medical staff identifier"

      - name: id_country
        data_type: varchar
        description: "country identifier"

      - name: id_period
        data_type: varchar
        description: "period (year) identifier"

      - name: staff_per_10000
        data_type: float
        data_tests:
          - not_null
        description: "number of either doctors or pharmacists per 10000 habitants"

  - name: slv_medical_staff
    description: "type of medical staff"
    columns:
      - name: id_medical_staff
        data_type: varchar
        data_tests:
          - unique
        description: "medical staff identifier"

      - name: desc_medical_staff
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['medical', 'pharmacist']
        description: "medical staff description"

  - name: slv_period
    description: "periods (per year) table"
    columns:
      - name: id_period
        data_type: varchar
        data_tests:
          - unique
        description: "period identifier"

      - name: desc_period
        data_type: timestamp_ntz
        description: "period description in timestamp format"

      - name: desc_year
        data_type: number
        description: "period description in year format"

      - name: desc_month
        data_type: number
        description: "period description in month format"

      - name: desc_day
        data_type: number
        description: "period description in day format"

  - name: slv_sex
    description: "sex table"
    columns:
      - name: id_sex
        data_type: varchar
        data_tests: 
          - unique
        description: "sex identifier"

      - name: desc_sex
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['male', 'both sexes', 'female']
        description: "sex description"

  - name: slv_sponsor
    description: ""
    columns:
      - name: id_sponsor
        data_type: varchar
        data_tests:
          - unique
        description: "sponsor identifier"

      - name: desc_sponsor
        data_type: varchar
        description: "sponsor description"

  - name: slv_type_disease
    description: "type of disease table"
    columns:
      - name: id_type_disease
        data_type: varchar
        data_tests:
          - unique
        description: "type of disease identifier"

      - name: desc_type_disease
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['infectious disease', 'non infectious disease', 'other']
        description: "type of disease description"

  - name: slv_uhc_class
    description: "uhc class according to uhc index"
    columns:
      - name: id_uhc_class
        data_type: varchar
        data_tests:
          - unique
        description: "uhc class identifier"

      - name: desc_uhc_class
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['INTERMEDIATE', 'HIGH', 'WEAK']
        description: "UHC class description"

  - name: slv_uhc_index
    description: ""
    columns:
      - name: id_uhc_class
        data_type: varchar
        description: ""

      - name: id_country
        data_type: varchar
        description: ""

      - name: id_period
        data_type: varchar
        description: ""

      - name: uhc_index
        data_type: integer
        data_tests:
          - not_null
        description: ""