version: 2

models:
  - name: gld_dim_country
    description: "country dimension"
    columns:
      - name: id_country
        data_type: varchar
        data_tests:
          - unique
        description: ""

      - name: desc_country
        data_type: varchar
        description: ""

  - name: gld_dim_disease
    description: "disease dimension"
    columns:
      - name: id_disease
        data_type: varchar
        data_tests:
          - unique
        description: ""

      - name: desc_disease
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['diabetes', 'tuberculosis', 'hepatitis', 'other', 'ets', 'chronic respiratory', 'hiv', 'infc respiratory', 'cancer', 'cardiovascular', 'total infc', 'total noninfc']
        description: ""

  - name: gld_dim_period
    description: "period dimension"
    columns:
      - name: id_period
        data_type: varchar
        data_tests:
          - unique
        description: ""

      - name: desc_period
        data_type: timestamp_ntz
        description: ""

      - name: desc_year
        data_type: number
        description: ""

      - name: desc_month
        data_type: number
        description: ""

      - name: desc_day
        data_type: number
        description: ""

  - name: gld_dim_sex
    description: "sex dimension"
    columns:
      - name: id_sex
        data_type: varchar
        data_tests:
          - unique
        description: ""

      - name: desc_sex
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['male', 'female', 'both sexes']
        description: ""

  - name: gld_dim_sponsor
    description: "sponsor dimension"
    columns:
      - name: id_sponsor
        data_type: varchar
        data_tests:
          - unique
        description: ""

      - name: desc_sponsor
        data_type: varchar
        description: ""

  - name: gld_dim_type_disease
    description: "type disease"
    columns:
      - name: id_type_disease
        data_type: varchar
        description: ""

      - name: desc_type_disease
        data_type: varchar
        data_tests:
        - accepted_values:
              arguments:
                values: ['infectious disease', 'non infectious disease', 'other']
        description: ""

  - name: gld_dim_uhc_class
    description: ""
    columns:
      - name: uhc_class_id
        data_type: varchar
        data_tests:
          - unique
        description: ""

      - name: desc_uhc_class
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['INTERMEDIATE', 'HIGH', 'WEAK']
        description: ""

  - name: gld_fct_dis
    description: ""
    columns:
      - name: id_country
        data_type: varchar
        description: ""

      - name: id_period
        data_type: varchar
        description: ""

      - name: id_sex
        data_type: varchar
        description: ""

      - name: id_type_disease
        data_type: varchar
        description: ""

      - name: id_disease
        data_type: varchar
        description: ""

      - name: value
        data_type: float
        data_tests:
          - not_null
        description: ""

  - name: gld_fct_drug
    description: "Helps in calculating which disease has less treatments available and which company would get more benefit from a specific disease"
    columns:
      - name: id_disease
        data_type: varchar
        description: ""

      - name: id_sponsor
        data_type: varchar
        description: ""

      - name: num_treatments
        data_type: float
        data_tests:
          - not_null
        description: "num of treatments available grouped by disease and sponsor"

      - name: avg_price_per_dose
        data_type: float
        data_tests:
          - not_null
        description: "average price per dose grouped by disease and sponsor"

      - name: estimated_revenue_index
        data_type: float
        data_tests:
          - not_null
        description: "calculated through multiplying num_treatments and avg_price_per_dose grouped by disease and sponsor"

  - name: gld_fct_health
    description: ""
    columns:
      - name: id_country
        data_type: varchar
        data_tests:
          - not_null
        description: ""

      - name: id_period
        data_type: varchar
        data_tests:
          - not_null
        description: ""

      - name: id_uhc_class
        data_type: varchar
        data_tests:
          - not_null
        description: ""

      - name: staff_per_10000
        data_type: float
        data_tests:
          - not_null
        description: ""

      - name: uhc_index
        data_type: number
        data_tests:
          - not_null
        description: ""

      - name: clinical_trial_score
        data_type: float
        data_tests:
          - not_null
        description: ""

      - name: country_rank
        data_type: float
        description: ""

      