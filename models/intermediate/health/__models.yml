version: 2

models:
  
  - name: int_health_staff
    description: "combination of both pharmacists and doctors per country and year"
    columns:
      - name: period
        data_type: timestamp_ntz
        data_tests:
          - not_null
        description: "period per year"

      - name: country
        data_type: varchar
        data_tests:
          - not_null
        description: "country"

      - name: doct_per_10000
        data_type: float
        data_tests:
          - not_null
        description: "numb of doctors per 10000 habitants"

      - name: pharm_per_10000
        data_type: float
        data_tests:
          - not_null
        description: "numb of pharmacists per 10000 habitants"

  - name: int_uhc_coverage
    description: "uhc index indicating health system level per country (0-49: low; 50-75: intermediate; 76-100: high)"
    columns:
      - name: country
        data_type: varchar
        description: "country"

      - name: period
        data_type: timestamp_ntz
        description: "period per year"

      - name: uhc_index
        data_type: integer
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: 
                min_value: 0
                max_value: 100
        description: "number indicating health system level"

      - name: uhc_class
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['INTERMEDIATE', 'HIGH', 'WEAK']
        description: "class according to uhc_index"

